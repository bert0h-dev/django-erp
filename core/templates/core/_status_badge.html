{% comment %}Etiqueta de un estado del catálogo (core.Status). Recibe: status. El color sale de is_active, no del nombre.{% endcomment %}{% if not status %}<span class="portal-status portal-status--other">Sin estado</span>{% elif status.is_active %}<span class="portal-status portal-status--active">{{ status.name }}</span>{% else %}<span class="portal-status portal-status--inactive">{{ status.name }}</span>{% endif %}
